<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QC-1 — Trust made simple</title>
  <style>
    :root {
      --teal: #1fa6a0;
      --ink: #1f2933;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
    }

    .eyebrow {
      color: var(--teal);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 14px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 0.95;
    }

    .tagline {
      font-size: 24px;
      margin: 0 0 28px;
    }

    .rule {
      height: 1px;
      background: var(--line);
      margin: 28px 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
    }

    .tick {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--teal);
      color: white;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="eyebrow">QC-1</div>

      <h1>Trust made simple.</h1>

      <p class="tagline">
        A simple trust and verification layer for QR-linked destinations.
      </p>

      <div class="rule"></div>

      <div class="status">
        <span class="tick">✓</span>
        QC-1 pilot is live
      </div>

      <p>
        QC-1 checks registered destinations, issuer identity and service status
        while keeping the QR itself ordinary and universally readable.
      </p>
    </section>
  </main>
</body>
</html>
